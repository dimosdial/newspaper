<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="Daily Newspaper">
<meta name="theme-color" content="#111312">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<meta name="robots" content="noindex, nofollow">
<title>Daily Newspaper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=GFS+Didot&family=Commissioner:wght@400;500;600;700&display=swap">
<style>
/* Layout: dark, quiet front page. Each section is a panel with its own soft hue; links are small tiles with the site's icon. Three columns on desktop, one on phones; Blogs runs full width at the end. */
:root{
  --bg:#111312; --panel:#181b1a; --tile:#1f2321; --line:#272b29; --fg:#e6e5e0; --muted:#8d958f;
  --serif:"GFS Didot","Didot","Bodoni 72","Times New Roman",serif;
  --sans:"Commissioner",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.35;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:14px 40px}
.wrap{max-width:1180px;margin:0 auto}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:8px}

.mast{text-align:center;padding-bottom:6px;border-bottom:3px double #3a3f3c}
.mast h1{font-family:var(--serif);font-weight:400;font-size:clamp(34px,7vw,64px);line-height:1;margin:2px 0 4px;letter-spacing:.01em}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:10px;align-items:center;padding:8px 0 10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar input{flex:1 1 200px;min-width:0;font:inherit;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg)}
.bar input::placeholder{color:var(--muted)}
.idx{flex:1 1 auto;display:flex;gap:6px;flex-wrap:wrap;min-width:0}
@media (max-width:620px){.idx{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.idx::-webkit-scrollbar{display:none}.idx a{flex:0 0 auto}}
.idx a{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;padding:6px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
.idx a i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.idx a:hover{color:var(--fg);border-color:var(--c)}

.paper{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start;margin-top:4px}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:900px){.paper{grid-template-columns:repeat(2,minmax(0,1fr))}.col:nth-child(3){grid-column:1/-1}}
@media (max-width:620px){.paper{grid-template-columns:1fr}}
.tail{margin-top:14px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 12px 10px;scroll-margin-top:64px;
  background-image:linear-gradient(180deg,color-mix(in srgb,var(--c) 9%,transparent),transparent 70px)}
.ph{display:flex;align-items:center;gap:8px;margin:2px 2px 10px}
.ph i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 18%,transparent)}
.ph h2{font-family:var(--serif);font-weight:400;font-size:24px;line-height:1;margin:0;letter-spacing:.01em}
.ph span{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
h3{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:color-mix(in srgb,var(--c) 70%,var(--muted));margin:10px 2px 6px}

.tiles{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px}
.tiles a{display:flex;align-items:center;gap:8px;padding:7px;border-radius:10px;background:var(--tile);border:1px solid transparent;min-height:44px}
.tiles a:hover{border-color:color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 10%,var(--tile))}
.ic{position:relative;flex:0 0 26px;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;overflow:hidden;
  background:color-mix(in srgb,var(--c) 22%,var(--tile));color:var(--c);font-size:11.5px;font-weight:700;letter-spacing:.02em}
.ic img{width:18px;height:18px;border-radius:3px;display:block}
.ic.ok{background:#f2f2ef}
.fb{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:3px;background:#1877f2;color:#fff;font-size:8px;font-weight:700;line-height:11px;text-align:center;font-family:Arial,sans-serif}
.n{font-weight:500;font-size:13px;overflow-wrap:anywhere;min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

.sub{display:flex;justify-content:center;padding:8px 0 0}
.wx{font-size:12.5px;color:var(--muted);display:flex;gap:4px 12px;flex-wrap:wrap;justify-content:center;align-items:baseline;min-width:0}
.wx b{color:var(--fg);font-weight:600;font-size:15px}
.soc{flex:0 0 auto;margin-left:auto;display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.soc a{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--tile);font-size:11px;font-weight:700;color:var(--muted)}
.soc a:hover{background:#2a2f2c}
.soc img{width:18px;height:18px;border-radius:3px}
.ph{cursor:pointer;user-select:none}
.ph .chev{width:18px;height:18px;margin-left:6px;color:var(--muted);transition:transform .2s}
.panel.closed .chev{transform:rotate(-90deg)}
.panel.closed .grp{display:none}
.panel.closed .ph{margin-bottom:2px}
.when{display:block;font-size:11px;color:var(--muted);margin-top:1px;font-weight:400}
.txt{min-width:0;display:flex;flex-direction:column}
.seen .n,.seen .ic{opacity:.45}
.seen .when{color:color-mix(in srgb,var(--c) 70%,var(--muted))}
.empty{color:var(--muted);font-style:italic;padding:12px 2px}
@media (prefers-reduced-motion:no-preference){.tiles a,.idx a{transition:background .15s,border-color .15s,color .15s}}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast"><h1>Daily Newspaper</h1></header>
  <div class="sub"><div class="wx" id="wx" aria-live="polite"></div></div>
  <div class="bar">
    <nav class="idx" id="idx" aria-label="Ενότητες"></nav>
    <nav class="soc" id="soc" aria-label="Social media"></nav>
  </div>
  <main class="paper" id="paper"></main>
  <div class="tail" id="tail"></div>
</div>
<script>
const D={"cols": [[{"id": "sport", "t": "Αθλητικά", "groups": [["", [{"n": "Gazzetta", "u": "https://www.gazzetta.gr/"}, {"n": "SDNA", "u": "https://www.sdna.gr/"}, {"n": "Athletiko", "u": "https://www.athletiko.gr/"}, {"n": "Man Utd News", "u": "https://www.facebook.com/groups/manutdgr/"}]]], "c": "#5cc0b5"}, {"id": "pao", "t": "Παναθηναϊκός", "groups": [["Sites", [{"n": "Panathinaikos Press", "u": "https://www.panathinaikospress.com/"}, {"n": "The Hateful 8", "u": "https://thehateful8.gr/"}, {"n": "SDNA — ΠΑΟ μπάσκετ", "u": "https://www.sdna.gr/teams/panathinaikos-aktor"}, {"n": "Pick and Roll — Euroleague", "u": "https://www.pickandroll.gr/category/eidiseis/evropi/euroleague/"}]], ["Στο Facebook", [{"n": "Ορίστε Σανό, Φάτε Πρόβατα", "u": "https://www.facebook.com/sanogiaprobata/"}, {"n": "Παναθηναϊκός Συναγερμός", "u": "https://www.facebook.com/%CE%A0%CE%B1%CE%BD%CE%B1%CE%B8%CE%B7%CE%BD%CE%B1%CF%8A%CE%BA%CF%8C%CF%82-%CE%A3%CF%85%CE%BD%CE%B1%CE%B3%CE%B5%CF%81%CE%BC%CF%8C%CF%82-722788938113217/"}, {"n": "Panathinaikos Our Pride II", "u": "https://www.facebook.com/100063609995395/"}, {"n": "Panathinaikos BC Retro", "u": "https://www.facebook.com/PaoBcHistory"}, {"n": "Θοδωρής Μαραγκουδάκης", "u": "https://www.facebook.com/teomarag"}, {"n": "Αριστοτέλης Μπένογλου", "u": "https://www.facebook.com/profile.php?id=100008111087198"}]], ["Forums", [{"n": "PanathaGR forum", "u": "http://www.panathagrforum.net/"}, {"n": "RedCafe", "u": "https://www.redcafe.net/"}]]], "c": "#4fbf80"}], [{"id": "news", "t": "Ειδήσεις", "groups": [["", [{"n": "News 24/7", "u": "https://www.news247.gr/"}, {"n": "Πρώτο Θέμα", "u": "https://www.protothema.gr/"}, {"n": "ThePressProject", "u": "https://www.thepressproject.gr/"}, {"n": "Documento", "u": "https://www.documentonews.gr/"}, {"n": "Κουρδιστό Πορτοκάλι", "u": "https://kourdistoportocali.com/"}, {"n": "SLPress", "u": "https://slpress.gr/"}, {"n": "Pronews", "u": "https://www.pronews.gr/"}]]], "c": "#6ea8e0"}, {"id": "city", "t": "Πόλη & Lifestyle", "groups": [["", [{"n": "Athinorama", "u": "https://www.athinorama.gr/"}, {"n": "More.com — Εκδηλώσεις", "u": "https://www.more.com/gr-el/"}, {"n": "Popaganda", "u": "https://popaganda.gr/"}, {"n": "OneMan", "u": "https://www.oneman.gr/"}, {"n": "Unboxholics", "u": "https://unboxholics.com/"}, {"n": "Τσιλί Καφενείο", "u": "https://www.facebook.com/search/top/?q=%CE%A4%CE%A3%CE%99%CE%9B%CE%99%20%CE%9A%CE%91%CE%A6%CE%95%CE%9D%CE%95%CE%99%CE%BF"}]]], "c": "#d9a65a"}, {"id": "feeds", "t": "Περιοδικά", "groups": [["", [{"n": "Flipboard", "u": "https://flipboard.com/"}]]], "c": "#d98a9a"}], [{"id": "topics", "t": "Θέματα", "groups": [["PlayStation", [{"n": "PS5", "u": "https://www.insomnia.gr/forums/topic/809061-playstation-5pro-topic-v4/page/555/"}, {"n": "PS Plus", "u": "https://www.insomnia.gr/forums/topic/831024-playstation-plus-%CF%83%CF%85%CE%BD%CE%B4%CF%81%CE%BF%CE%BC%CE%AE-%CF%84%CE%BF%CF%85%CF%81%CE%BA%CE%AF%CE%B1%CF%82-v2/page/50/"}, {"n": "Ps5forums", "u": "http://www.ps4forums.gr/vb/forumdisplay.php/65-Playstation-5"}]], ["Apple", [{"n": "iOS 27", "u": "http://www.iphonehellas.gr/forum/topic/174163-ios-27/page-2#entry2097095"}, {"n": "AirPods Pro 3", "u": "http://forum.iphonehellas.gr/topic/174101-airpods-pro-3-%CE%B4%CE%B9%CE%AC%CE%B8%CE%B5%CF%83%CE%B7-%CF%80%CE%B1%CF%81%CE%B1%CE%BB%CE%B1%CE%B2%CE%AE-%CE%B5%CE%BD%CF%84%CF%85%CF%80%CF%8E%CF%83%CE%B5%CE%B9%CF%82/"}, {"n": "iPhone 15 Pro", "u": "https://www.macrumors.com/roundup/iphone-15-pro/"}, {"n": "MacRumors iPhone", "u": "https://forums.macrumors.com/forums/iphone.99/"}, {"n": "MacRumors Αξεσουάρ", "u": "https://forums.macrumors.com/forums/iphone-accessories.108/"}, {"n": "MacRumors Tips", "u": "https://forums.macrumors.com/forums/iphone-tips-help-and-troubleshooting.109/"}]], ["Streaming & τηλεπικοινωνίες", [{"n": "Stremio", "u": "https://www.adslgr.com/forum/threads/1256802-stremio-media-center/page79"}, {"n": "Πειρατεία", "u": "https://www.insomnia.gr/forums/topic/845232-%CF%80%CF%81%CF%8C%CF%83%CF%84%CE%B9%CE%BC%CE%B1-%CE%AD%CF%89%CF%82-5000-%CE%B5%CF%85%CF%81%CF%8E-%CE%B3%CE%B9%CE%B1-%CF%80%CE%B5%CE%B9%CF%81%CE%B1%CF%84%CE%B5%CE%AF%CE%B1-%CF%8C%CE%BB%CE%B5%CF%82-%CE%BF%CE%B9-%CE%BB%CE%B5%CF%80%CF%84%CE%BF%CE%BC%CE%AD%CF%81%CE%B5%CE%B9%CE%B5%CF%82-%CF%84%CE%B7%CF%82-%CE%BD%CE%AD%CE%B1%CF%82-%CF%85%CF%80%CE%BF%CF%85%CF%81%CE%B3%CE%B9%CE%BA%CE%AE%CF%82-%CE%B1%CF%80%CF%8C%CF%86%CE%B1%CF%83%CE%B7%CF%82/page/52/"}, {"n": "Magenta Pay", "u": "https://www.insomnia.gr/forums/topic/810213-magenta-pay-by-telekom-former-payzy/page/58/"}]], ["Προσφορές", [{"n": "Unboxing Specialist", "u": "https://unboxingspecialist.com/"}]]], "c": "#a58be0"}]], "tail": [{"id": "blogs", "t": "Blogs", "groups": [["", [{"n": "Το Εξπρές του Διαδικτύου", "u": "https://nikosmaris.substack.com/"}, {"n": "Analyst", "u": "https://www.analyst.gr/"}, {"n": "Terrapapers", "u": "http://terrapapers.com/"}, {"n": "Τραιανού", "u": "https://traianou.gr/"}, {"n": "Πάρε-Δώσε", "u": "https://www.pare-dose.net/"}, {"n": "Anaximandros", "u": "https://nikolaosanaximandros.gr/"}, {"n": "Awakengr", "u": "https://www.awakengr.com/"}, {"n": "Έσσετ' Ήμαρ", "u": "http://perseasorion.blogspot.com/"}, {"n": "Πύλη του Φωτός", "u": "https://gateoflight.blogspot.com/"}, {"n": "Εννέα Έτη Φωτός", "u": "http://enneaetifotos.blogspot.com/"}]], ["Στο Facebook", [{"n": "Fileas Fonk", "u": "https://www.facebook.com/fileashistory"}, {"n": "Φιλέας Πετρίδης", "u": "https://www.facebook.com/fileas.petridis"}, {"n": "Konstantinos Farsalinos", "u": "https://www.facebook.com/konstantinos.farsalinos"}, {"n": "Κωνσταντίνος Βαθιώτης", "u": "https://www.facebook.com/kvathiot"}, {"n": "Nicos Kastanias", "u": "https://www.facebook.com/nicos.kastanias"}, {"n": "Φοίβος Μουσιγέτης", "u": "https://www.facebook.com/profile.php?id=100036338083723"}, {"n": "Γιάννης Καραμολέγκος", "u": "https://www.facebook.com/profile.php?id=100007897353202"}, {"n": "Δημήτριος Γάκης", "u": "https://www.facebook.com/profile.php?id=100014275599790"}, {"n": "Dimitrios Kouvelas", "u": "https://www.facebook.com/dimitrios.kouvelas"}]]], "c": "#e0906a"}]};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const host=u=>{try{return new URL(u).hostname.replace(/^(www\d?|m)\./,"")}catch(e){return""}};
const initials=n=>{const w=n.replace(/[—–-].*$/,"").trim().split(/\s+/).filter(Boolean);return ((w[0]||"")[0]+((w[1]||"")[0]||"")).toUpperCase()};
const icon=l=>{const h=host(l.u);
  if(/facebook\.com$/.test(h))return `<span class="ic">${esc(initials(l.n))}<b class="fb">f</b></span>`;
  return `<span class="ic"><img src="https://icons.duckduckgo.com/ip3/${esc(h)}.ico" alt="" loading="lazy" onload="this.parentNode.classList.add('ok')" onerror="this.parentNode.textContent='${esc(initials(l.n))}'"></span>`};
const tile=l=>`<li data-k="${esc((l.n+" "+host(l.u)).toLowerCase())}"><a href="${esc(l.u)}" target="_blank" rel="noopener" data-u="${esc(l.u)}">${icon(l)}<span class="txt"><span class="n">${esc(l.n)}</span><span class="when" hidden></span></span></a></li>`;
const count=s=>s.groups.reduce((a,[,ls])=>a+ls.length,0);
const sec=s=>`<section class="panel" id="${s.id}" style="--c:${s.c}">
  <div class="ph" role="button" tabindex="0" aria-expanded="true"><i></i><h2>${esc(s.t)}</h2><span>${count(s)}</span><svg class="chev" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 8l5 5 5-5"/></svg></div>
  ${s.groups.map(([h,ls])=>`<div class="grp">${h?`<h3>${esc(h)}</h3>`:""}<ul class="tiles">${ls.map(tile).join("")}</ul></div>`).join("")}
</section>`;
document.getElementById("paper").innerHTML=D.cols.map(c=>`<div class="col">${c.map(sec).join("")}</div>`).join("");
document.getElementById("tail").innerHTML=D.tail.map(sec).join("");
document.getElementById("idx").innerHTML=[...D.cols.flat(),...D.tail].map(s=>`<a href="#${s.id}" style="--c:${s.c}"><i></i>${esc(s.t)}</a>`).join("");
/* storage (only on this device) */
const st={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* last opened */
let visits=st.get("dn-visits",{});
const dayStart=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};
const ago=t=>{const d0=dayStart(),day=864e5;
  if(t>=d0)return "σήμερα "+new Date(t).toLocaleTimeString("el-GR",{hour:"2-digit",minute:"2-digit",hour12:false});
  if(t>=d0-day)return "χθες";
  const n=Math.ceil((d0-t)/day);
  if(n<7)return "πριν "+n+" μέρες";
  return new Date(t).toLocaleDateString("el-GR",{day:"numeric",month:"short"});};
const paint=()=>{const d0=dayStart();
  document.querySelectorAll(".tiles a[data-u]").forEach(a=>{const t=visits[a.dataset.u];const w=a.querySelector(".when");
    if(t){w.textContent=ago(t);w.hidden=false}else{w.hidden=true}
    a.classList.toggle("seen",!!t&&t>=d0)});};
document.addEventListener("click",e=>{const a=e.target.closest(".tiles a[data-u]");if(!a)return;
  visits[a.dataset.u]=Date.now();st.set("dn-visits",visits);setTimeout(paint,50);});
paint();
document.addEventListener("visibilitychange",()=>{if(!document.hidden){visits=st.get("dn-visits",visits);paint()}});

/* collapsible sections */
let closed=st.get("dn-closed",[]);
document.querySelectorAll(".panel").forEach(p=>{const h=p.querySelector(".ph");
  const set=c=>{p.classList.toggle("closed",c);h.setAttribute("aria-expanded",String(!c))};
  set(closed.includes(p.id));
  const tog=()=>{const c=!p.classList.contains("closed");set(c);closed=c?[...new Set([...closed,p.id])]:closed.filter(x=>x!==p.id);st.set("dn-closed",closed)};
  h.addEventListener("click",tog);h.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();tog()}});});

/* socials */
const SOC=[["Facebook","https://www.facebook.com/"],["Instagram","https://www.instagram.com/"],["X","https://x.com/"],["TikTok","https://www.tiktok.com/"],["YouTube","https://www.youtube.com/"]];
document.getElementById("soc").innerHTML=SOC.map(([n,u])=>`<a href="${u}" target="_blank" rel="noopener" title="${n}" aria-label="${n}"><img src="https://icons.duckduckgo.com/ip3/${host(u)}.ico" alt="" onerror="this.replaceWith(document.createTextNode('${n[0]}'))"></a>`).join("");

/* weather, Athens (Open-Meteo) */
const WX=c=>c===0?"Αίθριος":c<=2?"Λίγα σύννεφα":c===3?"Συννεφιά":c<=48?"Ομίχλη":c<=57?"Ψιχάλες":c<=67?"Βροχή":c<=77?"Χιόνι":c<=82?"Μπόρες":"Καταιγίδα";
fetch("https://api.open-meteo.com/v1/forecast?latitude=37.98&longitude=23.73&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FAthens&forecast_days=2")
 .then(r=>r.json()).then(w=>{const d=w.daily,r=i=>Math.round(d.temperature_2m_min[i])+"–"+Math.round(d.temperature_2m_max[i])+"°";
   document.getElementById("wx").innerHTML=`<span>Αθήνα <b>${Math.round(w.current.temperature_2m)}°</b> ${WX(w.current.weather_code)}</span><span>Σήμερα ${r(0)} ☂${d.precipitation_probability_max[0]}%</span><span>Αύριο ${r(1)} ☂${d.precipitation_probability_max[1]}%</span>`;})
 .catch(()=>{});
</script>
</body>
</html>
